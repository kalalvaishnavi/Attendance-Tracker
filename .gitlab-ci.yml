stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.10-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt pytest
  script:
    - python -m pytest -o addopts=""
