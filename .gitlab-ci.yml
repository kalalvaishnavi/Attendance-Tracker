stages:
  - quality
  - security
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  paths:
    - .cache/pip

default:
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"

lint:
  stage: quality
  script:
    - ruff format --check .
    - ruff check .
    - flake8 .
    - pylint app.py sql_queries.py tests
    - mypy app.py sql_queries.py
    - pyupgrade --py310-plus app.py sql_queries.py tests/*.py
    - git diff --exit-code -- app.py sql_queries.py tests
    - vulture app.py sql_queries.py tests

test:
  stage: test
  script:
    - pytest
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/

bandit:
  stage: security
  script:
    - bandit -c pyproject.toml -r app.py sql_queries.py

pip-audit:
  stage: security
  script:
    - pip-audit

semgrep:
  stage: security
  image: semgrep/semgrep:latest
  before_script: []
  script:
    - semgrep ci --config auto --config p/python --config p/secrets

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  before_script: []
  script:
    - gitleaks detect --source . --config .gitleaks.toml --no-git --verbose
