name: format

on:
  push:
  pull_request:

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: pyupgrade --py310-plus app.py sql_queries.py tests/*.py
      - run: git diff --exit-code -- app.py sql_queries.py tests
